[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are meant to be in the browser bundle; the secrets
  # scan would otherwise fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_DEMO_MODE,NEXT_PUBLIC_API_BASE_URL,NEXT_PUBLIC_REGISTER_PATH,NEXT_PUBLIC_LOGIN_PATH,NEXT_PUBLIC_SEND_OTP_PATH,NEXT_PUBLIC_VERIFY_OTP_PATH,NEXT_PUBLIC_LOGOUT_PATH,NEXT_PUBLIC_RESTAURANT_ME_PATH,NEXT_PUBLIC_PROFILE_CHANGE_REQUESTS_PATH,NEXT_PUBLIC_CHANGE_PASSWORD_PATH,NEXT_PUBLIC_FORGOT_PASSWORD_PATH,NEXT_PUBLIC_RESET_PASSWORD_PATH,NEXT_PUBLIC_APPROVAL_PATH,NEXT_PUBLIC_ORDERS_PATH,NEXT_PUBLIC_REVIEWS_PATH,NEXT_PUBLIC_CUSTOMER_ORDERS_PATH,NEXT_PUBLIC_ORDER_UPDATE_PATH,NEXT_PUBLIC_DASHBOARD_SUMMARY_PATH,NEXT_PUBLIC_NOTIFICATIONS_PATH,NEXT_PUBLIC_CUISINES_PATH,NEXT_PUBLIC_MENU_ITEMS_PATH,NEXT_PUBLIC_MENU_IMAGE_BASE_URL,NEXT_PUBLIC_ADDONS_PATH,NEXT_PUBLIC_QTY_TYPES_PATH"
