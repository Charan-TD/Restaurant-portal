[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are meant to be in the browser bundle; the secrets
  # scan would otherwise fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_DEMO_MODE,NEXT_PUBLIC_API_BASE_URL,NEXT_PUBLIC_MENU_IMAGE_BASE_URL"
